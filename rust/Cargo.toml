[workspace]
resolver = "2"
members = [
    "crates/atomic-core",
    "crates/atomic-tools",
    "crates/atomic-provider-openai",
    "crates/atomic-cli",
    "crates/atomic-hyper-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["7-x Industries"]

[workspace.dependencies]
anyhow = "=1.0.95"
async-trait = "=0.1.83"
clap = { version = "=4.5.23", features = ["derive", "env"] }
futures-util = "=0.3.31"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.133"
tempfile = "=3.14.0"
thiserror = "=2.0.9"
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
# Rust 1.83 is the environment floor for this migration. These transitive
# compatibility pins keep Cargo from selecting post-1.83 releases.
url = "=2.5.2"
encoding_rs = "=0.8.35"
indexmap = "=2.7.0"
hashbrown = "=0.15.2"
idna = "=0.5.0"
